<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visite Virtuelle – Maison Andalouse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.7);
  }
  #crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-50%); }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; color: #f5e6c8; text-align: center; pointer-events: all;
  }
  #overlay h1 { font-size: 2.4rem; letter-spacing: 0.1em; color: #e8c97e; margin-bottom: .4rem; }
  #overlay p  { font-size: 1rem; opacity: .8; margin-bottom: .3rem; }
  #overlay .hint { font-size: .85rem; opacity: .55; margin-top: .6rem; }
  #startBtn {
    margin-top: 1.4rem; padding: .7rem 2.2rem; font-size: 1.1rem;
    background: #c07c2e; border: none; border-radius: 4px;
    color: #fff; cursor: pointer; letter-spacing: .08em;
    font-family: 'Georgia', serif;
    transition: background .2s;
  }
  #startBtn:hover { background: #d4922e; }
  #room-label {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    color: #f5e6c8; font-size: 1.05rem; letter-spacing: .12em;
    text-shadow: 0 1px 6px #000a; pointer-events: none;
    opacity: 0; transition: opacity .5s;
  }
  #minimap {
    position: fixed; bottom: 18px; right: 18px;
    width: 140px; height: 140px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.5); pointer-events: none;
  }
  #minimap canvas { width: 100%; height: 100%; }
  #controls-hint {
    position: fixed; top: 14px; right: 18px;
    color: rgba(255,255,255,.5); font-size: .72rem; line-height: 1.6;
    pointer-events: none; text-align: right;
  }
  /* Virtual joystick */
  #joystick-zone {
    position: fixed; bottom: 30px; left: 30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    display: none; /* shown only on touch devices */
    pointer-events: all; z-index: 15; touch-action: none;
  }
  #joystick-knob {
    position: absolute; top: 50%; left: 50%;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(200,150,60,0.75);
    border: 2px solid rgba(255,210,100,0.6);
    transform: translate(-50%,-50%);
    pointer-events: none;
  }
  /* Look zone (right side) */
  #look-zone {
    position: fixed; top: 0; right: 0;
    width: 55%; height: 100%;
    display: none;
    pointer-events: all; z-index: 14; touch-action: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="crosshair"></div>
  <div id="room-label"></div>
  <div id="minimap"><canvas id="minimap-canvas" width="140" height="140"></canvas></div>
  <div id="controls-hint">ZQSD / WASD : avancer<br>Souris : regarder</div>
</div>

<!-- Touch controls -->
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<div id="look-zone"></div>

<div id="overlay">
  <h1>Maison Inchallah</h1>
  <p>Visite virtuelle · Style Andalou</p>
  <p style="opacity:.5;font-size:.8rem">Algérie · 200 m²</p>
  <button id="startBtn">Entrer dans la maison</button>
  <div class="hint" id="controls-text">Joystick gauche : avancer · Glisser droite : regarder</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ─── Constants & palette ────────────────────────────────────────────────────
const S = 2; // world scale: 1 unit = 0.5m → house is ~40×30 units
// Real dims (metres → units, ×2)
// House footprint: 20m wide × 15m deep total U-shape
// Central body: 20m(L) × 5m(D) → 40u × 10u
// Left wing:     5m(L) × 10m(D) → 10u × 20u
// Right wing:    5m(L) × 10m(D) → 10u × 20u
// Courtyard:    10m(L) × 10m(D) → 20u × 20u

const WALL_H    = 6;   // 3m → 6u
const WALL_T    = 0.4; // wall thickness

const COL = {
  white:     0xF5F0E8,  // chaux blanche
  warmWhite: 0xEDE6D6,
  terracotta:0xC0603A,
  terracDark:0x9E4E2E,
  wood:      0x8B5A2B,
  woodLight: 0xA07040,
  woodDark:  0x5C3A1E,
  sand:      0xD4B896,
  stone:     0xC8B89A,
  stoneDark: 0xA89070,
  azulBlue:  0x2B6F9E,
  azulWhite: 0xEEEEDD,
  gold:      0xC8973A,
  black:     0x1A1A1A,
  sky:       0x87CEEB,
  greenLeaf: 0x4A7A3A,
  courtFloor:0xC4A882,
  iron:      0x2A2A2A,
  glass:     0x88BBCC,
};

// ─── Scene setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 40, 100);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 2.2, 28); // start outside main gate

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// ─── Lights ─────────────────────────────────────────────────────────────────
const sun = new THREE.DirectionalLight(0xFFF5E0, 2.2);
sun.position.set(20, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 150;
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

const ambient = new THREE.AmbientLight(0xFFEED0, 0.7);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x87CEEB, 0xC4A882, 0.4);
scene.add(hemi);

// ─── Material helpers ────────────────────────────────────────────────────────
function mat(color, rough=0.9, metal=0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}

function box(w, h, d, material, rx=0, ry=0, rz=0) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, material);
  m.castShadow = true;
  m.receiveShadow = true;
  m.rotation.set(rx, ry, rz);
  return m;
}

// ─── Texture: azulejo procedural ────────────────────────────────────────────
function makeAzulejoTexture(size=256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const tw = size/4;
  for (let row=0; row<4; row++) {
    for (let col=0; col<4; col++) {
      const x = col*tw, y = row*tw;
      ctx.fillStyle = '#2B6F9E';
      ctx.fillRect(x, y, tw, tw);
      ctx.strokeStyle = '#1A4A6E';
      ctx.lineWidth = 2;
      ctx.strokeRect(x+1, y+1, tw-2, tw-2);
      // simple star pattern
      ctx.fillStyle = '#EEEEDD';
      ctx.beginPath();
      ctx.arc(x+tw/2, y+tw/2, tw*0.28, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#C8973A';
      ctx.beginPath();
      ctx.arc(x+tw/2, y+tw/2, tw*0.12, 0, Math.PI*2);
      ctx.fill();
      // corner dots
      ctx.fillStyle = '#EEEEDD';
      for (const [cx,cy] of [[x+4,y+4],[x+tw-4,y+4],[x+4,y+tw-4],[x+tw-4,y+tw-4]]) {
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ─── Shared materials ────────────────────────────────────────────────────────
const azTex     = makeAzulejoTexture();
const matWall   = mat(COL.white, 0.95);
const matWallW  = mat(COL.warmWhite, 0.93);
const matTerra  = mat(COL.terracotta, 0.85);
const matFloor  = mat(COL.courtFloor, 0.92);
const matStone  = mat(COL.stone, 0.88);
const matWood   = mat(COL.wood, 0.8);
const matWoodL  = mat(COL.woodLight, 0.75);
const matIron   = mat(COL.iron, 0.7, 0.5);
const matGold   = mat(COL.gold, 0.4, 0.6);
const matGlass  = new THREE.MeshStandardMaterial({ color: COL.glass, roughness:0.05, metalness:0.1, transparent:true, opacity:0.35 });
const matLeaf   = mat(COL.greenLeaf, 0.9);
const matSand   = mat(COL.sand, 0.95);
const matAzulejo= new THREE.MeshStandardMaterial({ map: azTex, roughness:0.3, metalness:0.05 });

// ─── House geometry builder ──────────────────────────────────────────────────
// Coordinate system: X = West(-) to East(+), Z = South(-) to North(+)
// House center at 0,0
// Corps Central (north): z=0..10, x=-20..20
// Left wing (west):      x=-20..-10, z=-20..0
// Right wing (east):     x=10..20,   z=-20..0
// Courtyard:             x=-10..10,  z=-20..0

const colliders = []; // AABB colliders {minX,maxX,minZ,maxZ}

function addCollider(minX, maxX, minZ, maxZ) {
  colliders.push({minX, maxX, minZ, maxZ});
}

const houseMeshes = new THREE.Group();
scene.add(houseMeshes);

// ── Floor system ─────────────────────────────────────────────────────────────
function makeCheckerTex(c1, c2, size=256, tiles=8) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const ts = size/tiles;
  for (let r=0; r<tiles; r++) {
    for (let c=0; c<tiles; c++) {
      ctx.fillStyle = (r+c)%2===0 ? c1 : c2;
      ctx.fillRect(c*ts, r*ts, ts, ts);
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4,4);
  return t;
}

function makeStoneFloorTex(size=512) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#C4A882';
  ctx.fillRect(0, 0, size, size);
  // draw irregular stone tiles
  const seed = (n) => { let x=Math.sin(n)*10000; return x-Math.floor(x); };
  ctx.strokeStyle = '#9A7A5A';
  ctx.lineWidth = 2;
  for (let i=0; i<40; i++) {
    const x = seed(i*3)*size, y = seed(i*3+1)*size;
    const w = 30+seed(i*3+2)*50, h = 25+seed(i*7)*40;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = `rgba(${100+seed(i)*50},${80+seed(i*2)*40},${50+seed(i*4)*30},0.3)`;
    ctx.fillRect(x+1, y+1, w-2, h-2);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const stoneFloorTex = makeStoneFloorTex();
const matCourtFloor = new THREE.MeshStandardMaterial({ map: stoneFloorTex, roughness: 0.9 });

function addFloor(w, d, material, px, pz, y=0) {
  const m = box(w, 0.15, d, material);
  m.position.set(px, y-0.075, pz);
  houseMeshes.add(m);
}

// ── Wall builder ──────────────────────────────────────────────────────────────
const doors = []; // { mesh, open, axis, pivot, targetAngle }

function addWall(w, h, d, material, px, py, pz, ry=0) {
  const m = box(w, h, d, material);
  m.position.set(px, py + h/2, pz);
  m.rotation.y = ry;
  houseMeshes.add(m);
  // collider (axis-aligned approximation)
  const hw = w/2+0.1, hd = d/2+0.1;
  const cos = Math.abs(Math.cos(ry)), sin = Math.abs(Math.sin(ry));
  const ex = hw*cos + hd*sin;
  const ez = hw*sin + hd*cos;
  addCollider(px-ex, px+ex, pz-ez, pz+ez);
}

function addDoor(px, pz, ry=0, h=4.5, w=2.2, label='Porte') {
  // Door frame
  const frameM = mat(COL.woodDark, 0.7);
  const fT = 0.15;
  const frameTop = box(w + fT*2, fT, fT, frameM);
  frameTop.position.set(px, h + fT/2, pz);
  frameTop.rotation.y = ry;
  houseMeshes.add(frameTop);
  const fL = box(fT, h, fT, frameM);
  fL.position.set(px + Math.cos(ry)*(-w/2-fT/2), h/2, pz + Math.sin(ry)*(-w/2-fT/2));
  houseMeshes.add(fL);
  const fR = box(fT, h, fT, frameM);
  fR.position.set(px + Math.cos(ry)*(w/2+fT/2), h/2, pz + Math.sin(ry)*(w/2+fT/2));
  houseMeshes.add(fR);

  // Door panel
  const doorMat = mat(COL.woodDark, 0.65);
  const pivot = new THREE.Group();
  pivot.position.set(px - Math.cos(ry)*w/2, 0, pz - Math.sin(ry)*w/2);
  const panel = box(w-0.05, h-0.1, 0.08, doorMat);
  panel.position.set(Math.cos(ry)*w/2, h/2, Math.sin(ry)*w/2);
  panel.rotation.y = ry;
  // panel details
  const inset = box(w*0.7, h*0.3, 0.05, mat(COL.woodLight, 0.6));
  inset.position.set(Math.cos(ry)*w/2, h*0.7, Math.sin(ry)*w/2 + 0.06);
  inset.rotation.y = ry;
  pivot.add(panel);
  pivot.add(inset);
  houseMeshes.add(pivot);
  doors.push({ pivot, open: false, targetAngle: 0, label });
}

function addArch(px, py, pz, w=4, h=5, depth=WALL_T*1.5, ry=0) {
  // Arch = rectangular base + semicircle top
  const archMat = mat(COL.white, 0.95);
  // left pier
  const pierH = h - w/2;
  const pierW = (depth);
  const p1 = box(pierW, pierH, depth, archMat);
  p1.position.set(0, pierH/2, 0);
  const p2 = box(pierW, pierH, depth, archMat);
  p2.position.set(w, pierH/2, 0);
  // arch top (torus segment approximation with cylinder slices)
  const r = w/2;
  const archGroup = new THREE.Group();
  archGroup.add(p1); archGroup.add(p2);
  const segments = 12;
  for (let i=0; i<=segments; i++) {
    const angle = (Math.PI/segments)*i;
    const ax = r - r*Math.cos(angle);
    const ay = pierH + r*Math.sin(angle);
    const sliceW = (Math.PI*r/segments) + 0.05;
    const sliceMesh = box(sliceW, depth*0.95, depth, archMat);
    sliceMesh.position.set(ax, ay, 0);
    sliceMesh.rotation.z = -angle + Math.PI/2;
    archGroup.add(sliceMesh);
  }
  archGroup.position.set(px - w/2, py, pz);
  archGroup.rotation.y = ry;
  houseMeshes.add(archGroup);
}

// ── ROOF builder ──────────────────────────────────────────────────────────────
function addRoof(w, d, px, py, pz, ry=0) {
  // 4-slope shallow terracotta roof
  const roofMat = mat(COL.terracotta, 0.85);
  const roofDark = mat(COL.terracDark, 0.88);
  const pitch = 1.8;
  // Use a custom geometry with 4 triangular faces
  const verts = new Float32Array([
    // top center ridge (ridges along X)
    -w/2,pitch,0,   w/2,pitch,0,  // ridge
    -w/2,0,-d/2,   w/2,0,-d/2,   // front eave
    -w/2,0, d/2,   w/2,0, d/2,   // back eave
    0,pitch,0,                    // for hip ends
  ]);

  // Build with individual triangle planes
  // Front slope
  const mkSlope = (pts, mat) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts.flat()), 3));
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  };

  const hw = w/2, hd = d/2;
  const roofGroup = new THREE.Group();
  roofGroup.position.set(px, py, pz);
  roofGroup.rotation.y = ry;

  // front slope
  roofGroup.add(mkSlope([[-hw,0,-hd],[hw,0,-hd],[hw,pitch,0],[hw,pitch,0],[-hw,pitch,0],[-hw,0,-hd]], roofMat));
  // back slope
  roofGroup.add(mkSlope([[-hw,0,hd],[hw,pitch,0],[-hw,pitch,0],[hw,pitch,0],[hw,0,hd],[-hw,0,hd]], roofMat));
  // left hip
  roofGroup.add(mkSlope([[-hw,0,-hd],[-hw,pitch,0],[-hw,0,hd]], roofDark));
  // right hip
  roofGroup.add(mkSlope([[hw,0,-hd],[hw,0,hd],[hw,pitch,0]], roofDark));

  // Roof tiles (rows of cylinders)
  const tileMat = mat(COL.terracotta, 0.8);
  const tileRows = Math.floor(d*1.5);
  for (let i=0; i<tileRows; i++) {
    const t = i/tileRows;
    const tz = -hd + t*d;
    const ty = t < 0.5 ? (pitch * t*2) : (pitch * (1 - (t-0.5)*2));
    const tileGeo = new THREE.CylinderGeometry(0.12, 0.12, w, 6, 1, true);
    const tile = new THREE.Mesh(tileGeo, tileMat);
    tile.rotation.z = Math.PI/2;
    tile.position.set(0, ty + pitch + 0.12, tz);
    roofGroup.add(tile);
  }
  houseMeshes.add(roofGroup);
}

// ── Well (central courtyard) ──────────────────────────────────────────────────
function addWell(px, pz) {
  const wellGroup = new THREE.Group();
  wellGroup.position.set(px, 0, pz);

  // stone cylinder base
  const cyl = new THREE.CylinderGeometry(1.0, 1.0, 1.6, 16, 1, true);
  const wellMesh = new THREE.Mesh(cyl, mat(COL.stoneDark, 0.92));
  wellMesh.position.y = 0.8;
  wellMesh.castShadow = true;
  wellGroup.add(wellMesh);

  // top ring
  const ring = new THREE.TorusGeometry(1.0, 0.12, 8, 24);
  const ringMesh = new THREE.Mesh(ring, mat(COL.stone, 0.85));
  ringMesh.position.y = 1.65;
  ringMesh.rotation.x = Math.PI/2;
  wellGroup.add(ringMesh);

  // wrought iron arch over well
  const archR = 1.1;
  const archGeo = new THREE.TorusGeometry(archR, 0.06, 8, 20, Math.PI);
  const archMesh = new THREE.Mesh(archGeo, matIron);
  archMesh.position.y = 1.7;
  archMesh.rotation.x = Math.PI/2;
  wellGroup.add(archMesh);

  // two vertical posts
  for (const sx of [-1, 1]) {
    const post = box(0.1, 2.2, 0.1, matIron);
    post.position.set(sx*archR, 1.7 + 1.1, 0);
    wellGroup.add(post);
  }

  // pulley
  const pulley = new THREE.TorusGeometry(0.2, 0.04, 6, 12);
  const pulleyM = new THREE.Mesh(pulley, matIron);
  pulleyM.position.set(0, 3.1, 0);
  pulleyM.rotation.x = Math.PI/2;
  wellGroup.add(pulleyM);

  houseMeshes.add(wellGroup);
  addCollider(px-1.3, px+1.3, pz-1.3, pz+1.3);
}

// ── Pot plant ─────────────────────────────────────────────────────────────────
function addPot(px, pz, scale=1) {
  const g = new THREE.Group();
  g.position.set(px, 0, pz);
  const potG = new THREE.CylinderGeometry(0.3*scale, 0.2*scale, 0.5*scale, 10);
  const pot = new THREE.Mesh(potG, mat(COL.terracotta, 0.85));
  pot.position.y = 0.25*scale;
  g.add(pot);
  const soilG = new THREE.CylinderGeometry(0.28*scale, 0.28*scale, 0.05, 10);
  const soil = new THREE.Mesh(soilG, mat(0x3D2B1F, 0.95));
  soil.position.y = 0.52*scale;
  g.add(soil);
  // tree trunk
  const trunk = box(0.12*scale, 1.2*scale, 0.12*scale, mat(COL.woodDark, 0.8));
  trunk.position.y = 0.5*scale + 0.6*scale;
  g.add(trunk);
  // foliage
  const leafG = new THREE.SphereGeometry(0.55*scale, 8, 6);
  const leaf = new THREE.Mesh(leafG, matLeaf);
  leaf.position.y = 0.5*scale + 1.3*scale;
  leaf.scale.y = 1.3;
  g.add(leaf);
  g.traverse(m => { m.castShadow = true; m.receiveShadow = true; });
  houseMeshes.add(g);
}

// ── Olive tree (exterior) ─────────────────────────────────────────────────────
function addOlive(px, pz) {
  const g = new THREE.Group();
  g.position.set(px, 0, pz);
  const trunk = new THREE.CylinderGeometry(0.2, 0.3, 3, 8);
  g.add(Object.assign(new THREE.Mesh(trunk, mat(COL.woodDark, 0.9)), {castShadow:true, position:{x:0,y:1.5,z:0}}));
  for (let i=0; i<3; i++) {
    const leafG = new THREE.SphereGeometry(1.4 + i*0.2, 7, 5);
    const lm = new THREE.Mesh(leafG, mat(0x5A8A4A, 0.9));
    lm.position.set(Math.sin(i*2.1)*0.8, 3 + i*0.4, Math.cos(i*2.1)*0.8);
    lm.scale.y = 0.8;
    lm.castShadow = true;
    g.add(lm);
  }
  scene.add(g);
}

// ── Main gate ─────────────────────────────────────────────────────────────────
function addGate(px, pz) {
  const g = new THREE.Group();
  g.position.set(px, 0, pz);

  // stone pillars
  for (const sx of [-2.2, 2.2]) {
    const pillar = box(0.6, 5.5, 0.6, matStone);
    pillar.position.set(sx, 2.75, 0);
    g.add(pillar);
    const cap = box(0.8, 0.3, 0.8, matStone);
    cap.position.set(sx, 5.65, 0);
    g.add(cap);
  }

  // iron gate panels
  const panelW = 1.8;
  for (const sx of [-panelW/2-0.1, panelW/2+0.1]) {
    const panel = new THREE.Group();
    // frame
    for (const [bx,bw,bh,by] of [
      [0, panelW, 0.1, 4.4], // top bar
      [0, panelW, 0.1, 0.1], // bottom bar
      [-panelW/2+0.05, 0.1, 4.4, 2.2], // left post
      [panelW/2-0.05, 0.1, 4.4, 2.2],  // right post
    ]) {
      const b = box(bw, bh, 0.08, matIron);
      b.position.set(bx, by, 0);
      panel.add(b);
    }
    // vertical bars
    for (let i=1; i<7; i++) {
      const bar = box(0.07, 4.1, 0.07, matIron);
      bar.position.set(-panelW/2 + i*(panelW/7), 2.2, 0);
      // spear tips
      const tip = new THREE.ConeGeometry(0.08, 0.3, 4);
      const tipM = new THREE.Mesh(tip, matIron);
      tipM.position.set(-panelW/2 + i*(panelW/7), 4.55, 0);
      panel.add(tipM);
      panel.add(bar);
    }
    panel.position.set(sx > 0 ? panelW/2+0.1 : -panelW/2-0.1, 0, 0);
    g.add(panel);
  }

  // arch over gate
  const archGroup = new THREE.Group();
  const archR2 = 2.5;
  for (let i=0; i<=16; i++) {
    const angle = (Math.PI/16)*i;
    const ax = -Math.cos(angle)*archR2;
    const ay = 4.5 + Math.sin(angle)*archR2;
    const b = box(0.12, 0.12, 0.5, matIron);
    b.position.set(ax, ay, 0);
    b.rotation.z = angle;
    archGroup.add(b);
  }
  g.add(archGroup);

  g.traverse(m => { if(m.isMesh) { m.castShadow=true; m.receiveShadow=true; }});
  scene.add(g);
  addCollider(px-2.6, px+2.6, pz-0.4, pz+0.4);
}

// ─── Device detection ────────────────────────────────────────────────────────
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ─── First-person controller ─────────────────────────────────────────────────
let isLocked = false;
let gameStarted = false;
const keys = {};
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const direction = new THREE.Vector3();

document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

// Desktop: pointer lock
canvas.addEventListener('click', () => {
  if (gameStarted && !isTouchDevice && !isLocked) canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  isLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if (!isLocked) return;
  euler.setFromQuaternion(camera.quaternion);
  euler.y -= e.movementX * 0.002;
  euler.x -= e.movementY * 0.002;
  euler.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, euler.x));
  camera.quaternion.setFromEuler(euler);
});

// ─── Touch / Virtual Joystick ────────────────────────────────────────────────
const joyZone  = document.getElementById('joystick-zone');
const joyKnob  = document.getElementById('joystick-knob');
const lookZone = document.getElementById('look-zone');

// Joystick state
let joyActive = false, joyId = -1;
let joyOriginX = 0, joyOriginY = 0;
let joyDX = 0, joyDY = 0;
const JOY_R = 50; // max knob travel (px)

// Look state
let lookActive = false, lookId = -1;
let lookLastX = 0, lookLastY = 0;

if (isTouchDevice) {
  joyZone.style.display  = 'block';
  lookZone.style.display = 'block';
  document.getElementById('controls-hint').style.display = 'none';

  // --- Joystick touch handlers ---
  joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    const rect = joyZone.getBoundingClientRect();
    joyOriginX = rect.left + rect.width/2;
    joyOriginY = rect.top  + rect.height/2;
  }, { passive: false });

  joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      joyDX = t.clientX - joyOriginX;
      joyDY = t.clientY - joyOriginY;
      const len = Math.sqrt(joyDX*joyDX + joyDY*joyDY);
      if (len > JOY_R) { joyDX *= JOY_R/len; joyDY *= JOY_R/len; }
      joyKnob.style.transform = `translate(calc(-50% + ${joyDX}px), calc(-50% + ${joyDY}px))`;
    }
  }, { passive: false });

  const joyEnd = e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== joyId) continue;
      joyActive = false; joyId = -1; joyDX = 0; joyDY = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  };
  joyZone.addEventListener('touchend',    joyEnd);
  joyZone.addEventListener('touchcancel', joyEnd);

  // --- Look zone touch handlers ---
  lookZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    lookActive = true; lookId = t.identifier;
    lookLastX = t.clientX; lookLastY = t.clientY;
  }, { passive: false });

  lookZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== lookId) continue;
      const dx = t.clientX - lookLastX;
      const dy = t.clientY - lookLastY;
      lookLastX = t.clientX; lookLastY = t.clientY;
      euler.setFromQuaternion(camera.quaternion);
      euler.y -= dx * 0.004;
      euler.x -= dy * 0.004;
      euler.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, euler.x));
      camera.quaternion.setFromEuler(euler);
    }
  }, { passive: false });

  const lookEnd = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookId) { lookActive = false; lookId = -1; }
    }
  };
  lookZone.addEventListener('touchend',    lookEnd);
  lookZone.addEventListener('touchcancel', lookEnd);
}

function checkCollision(nx, nz) {
  for (const c of colliders) {
    if (nx > c.minX - PLAYER_R && nx < c.maxX + PLAYER_R &&
        nz > c.minZ - PLAYER_R && nz < c.maxZ + PLAYER_R) return true;
  }
  return false;
}

// ─── Minimap ─────────────────────────────────────────────────────────────────
const mmCanvas = document.getElementById('minimap-canvas');
const mmCtx = mmCanvas.getContext('2d');

function drawMinimap() {
  const W = 140, H = 140;
  mmCtx.clearRect(0, 0, W, H);
  const scale = W / 50;
  const ox = W/2, oz = H/2;

  mmCtx.fillStyle = 'rgba(200,180,140,0.6)';
  // Draw house footprint
  const toMM = (x, z) => [ox + x*scale/2, oz - z*scale/2];

  // Central body
  mmCtx.fillStyle = '#C8B49088';
  mmCtx.fillRect(...toMM(-20,10), 40*scale/2, 10*scale/2);
  // Left wing
  mmCtx.fillRect(...toMM(-20,0), 10*scale/2, 20*scale/2);
  // Right wing
  mmCtx.fillRect(...toMM(10,0), 10*scale/2, 20*scale/2);
  // Courtyard
  mmCtx.fillStyle = '#D4C4A888';
  mmCtx.fillRect(...toMM(-10,0), 20*scale/2, 20*scale/2);

  // Player
  const [px, pz] = toMM(camera.position.x, camera.position.z);
  mmCtx.fillStyle = '#E8973A';
  mmCtx.beginPath(); mmCtx.arc(px, pz, 3, 0, Math.PI*2); mmCtx.fill();

  // Direction indicator
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  mmCtx.strokeStyle = '#E8973A';
  mmCtx.lineWidth = 1.5;
  mmCtx.beginPath();
  mmCtx.moveTo(px, pz);
  mmCtx.lineTo(px + fwd.x*8, pz - fwd.z*8);
  mmCtx.stroke();
}

// ─── Room label ─────────────────────────────────────────────────────────────
const roomLabel = document.getElementById('room-label');
let lastRoom = '';
function updateRoomLabel() {
  const room = getCurrentRoom(camera.position.x, camera.position.z);
  if (room !== lastRoom) {
    lastRoom = room;
    roomLabel.textContent = room;
    roomLabel.style.opacity = '1';
    clearTimeout(roomLabel._t);
    roomLabel._t = setTimeout(() => roomLabel.style.opacity = '0', 3500);
  }
}

// ─── Animation loop ──────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameStarted) {
    const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 10 : 5;

    direction.set(0, 0, 0);

    // Keyboard input
    if (keys['KeyW'] || keys['KeyZ'] || keys['ArrowUp'])    direction.z -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])                   direction.z += 1;
    if (keys['KeyA'] || keys['KeyQ'] || keys['ArrowLeft'])  direction.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight'])                  direction.x += 1;

    // Touch joystick input
    if (joyActive && (Math.abs(joyDX) > 4 || Math.abs(joyDY) > 4)) {
      direction.x += joyDX / JOY_R;
      direction.z += joyDY / JOY_R;
    }

    if (direction.length() > 0) {
      direction.normalize();
      const yaw = new THREE.Quaternion();
      yaw.setFromEuler(new THREE.Euler(0, euler.y, 0));
      direction.applyQuaternion(yaw);

      const nx = camera.position.x + direction.x * speed * dt;
      const nz = camera.position.z + direction.z * speed * dt;
      if (!checkCollision(nx, camera.position.z)) camera.position.x = nx;
      if (!checkCollision(camera.position.x, nz)) camera.position.z = nz;
    }
  }

  camera.position.y = 2.2;

  updateRoomLabel();
  drawMinimap();
  renderer.render(scene, camera);
}

animate();
</script>
