<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Visite Virtuelle – Maison Andalouse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Georgia',serif;touch-action:none}
  #c{display:block;width:100vw;height:100vh}
  #xhair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}
  #xhair::before,#xhair::after{content:'';position:absolute;background:rgba(255,255,255,.7)}
  #xhair::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
  #xhair::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
  #rlabel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);color:#f5e6c8;font-size:1.05rem;letter-spacing:.12em;text-shadow:0 1px 6px #000a;pointer-events:none;opacity:0;transition:opacity .5s;z-index:10}
  #mm{position:fixed;bottom:18px;right:18px;width:120px;height:120px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);pointer-events:none;z-index:10}
  #mm canvas{width:100%;height:100%}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;color:#f5e6c8;text-align:center}
  #overlay h1{font-size:2.2rem;letter-spacing:.1em;color:#e8c97e;margin-bottom:.4rem}
  #overlay p{font-size:.95rem;opacity:.8;margin-bottom:.25rem}
  #startBtn{margin-top:1.4rem;padding:.8rem 2.4rem;font-size:1.1rem;background:#c07c2e;border:none;border-radius:6px;color:#fff;cursor:pointer;font-family:'Georgia',serif;-webkit-tap-highlight-color:transparent}
  #hint{font-size:.82rem;opacity:.5;margin-top:.7rem}
  /* virtual joystick */
  #joy{position:fixed;bottom:30px;left:30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.28);display:none;z-index:15;touch-action:none}
  #jknob{position:absolute;top:50%;left:50%;width:44px;height:44px;border-radius:50%;background:rgba(200,150,60,.8);border:2px solid rgba(255,210,100,.7);transform:translate(-50%,-50%)}
  /* look zone – right 60% */
  #look{position:fixed;top:0;right:0;width:60%;height:100%;display:none;z-index:14;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="xhair"></div>
<div id="rlabel"></div>
<div id="mm"><canvas id="mmc" width="120" height="120"></canvas></div>

<div id="joy"><div id="jknob"></div></div>
<div id="look"></div>

<div id="overlay">
  <h1>Maison Inchallah</h1>
  <p>Visite virtuelle · Style Andalou</p>
  <p style="opacity:.45;font-size:.78rem">Algérie · 200 m²</p>
  <button id="startBtn">Entrer dans la maison</button>
  <div id="hint">Joystick gauche · Glisser droite pour regarder</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

// ── palette ──────────────────────────────────────────────────────────────────
const C={
  white:0xF5F0E8,warm:0xEDE6D6,terra:0xC0603A,terraDk:0x9E4E2E,
  wood:0x8B5A2B,woodL:0xA07040,woodDk:0x5C3A1E,sand:0xD4B896,
  stone:0xC8B89A,stoneDk:0xA89070,iron:0x1E1E1E,gold:0xC8973A,
  leaf:0x4A7A3A,sky:0x87CEEB,court:0xC4A882,glass:0x88BBCC,black:0x111111
};
const WH=6, WT=0.4;

// ── renderer / scene / camera ────────────────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(C.sky);
scene.fog=new THREE.Fog(C.sky,40,110);

const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,120);
cam.position.set(0,2.2,28);

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
});

// ── lights ───────────────────────────────────────────────────────────────────
const sun=new THREE.DirectionalLight(0xFFF5E0,2.2);
sun.position.set(20,40,20);
sun.castShadow=true;
Object.assign(sun.shadow.camera,{near:1,far:150,left:-55,right:55,top:55,bottom:-55});
sun.shadow.mapSize.set(2048,2048);
scene.add(sun,new THREE.AmbientLight(0xFFEED0,0.7),new THREE.HemisphereLight(C.sky,C.court,0.4));

// ── helpers ───────────────────────────────────────────────────────────────────
const mst=(color,r=0.9,m=0)=>new THREE.MeshStandardMaterial({color,roughness:r,metalness:m});

function mkBox(w,h,d,mat){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.castShadow=mesh.receiveShadow=true;
  return mesh;
}

const colliders=[];
function addCol(x0,x1,z0,z1){colliders.push({x0,x1,z0,z1});}

// shared mats
const mWall  =mst(C.white,0.95);
const mWallW =mst(C.warm,0.93);
const mTerra =mst(C.terra,0.85);
const mStone =mst(C.stone,0.88);
const mWood  =mst(C.wood,0.78);
const mWoodDk=mst(C.woodDk,0.72);
const mIron  =mst(C.iron,0.7,0.5);
const mLeaf  =mst(C.leaf,0.9);
const mGlass =new THREE.MeshStandardMaterial({color:C.glass,roughness:.05,metalness:.1,transparent:true,opacity:.35});

// azulejo canvas texture
function mkAzTex(){
  const cv=document.createElement('canvas'); cv.width=cv.height=256;
  const x=cv.getContext('2d'), t=64;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const px=c*t,py=r*t;
    x.fillStyle='#2B6F9E'; x.fillRect(px,py,t,t);
    x.strokeStyle='#1A4A6E'; x.lineWidth=2; x.strokeRect(px+1,py+1,t-2,t-2);
    x.fillStyle='#EEEEDD'; x.beginPath(); x.arc(px+t/2,py+t/2,t*.28,0,Math.PI*2); x.fill();
    x.fillStyle='#C8973A'; x.beginPath(); x.arc(px+t/2,py+t/2,t*.11,0,Math.PI*2); x.fill();
    x.fillStyle='#EEEEDD';
    [[px+4,py+4],[px+t-4,py+4],[px+4,py+t-4],[px+t-4,py+t-4]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,2.5,0,Math.PI*2);x.fill();});
  }
  const tex=new THREE.CanvasTexture(cv); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; return tex;
}
const mAzul=new THREE.MeshStandardMaterial({map:mkAzTex(),roughness:.3,metalness:.05});

// stone floor texture
function mkStoneTex(){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  const x=cv.getContext('2d');
  x.fillStyle='#C4A882'; x.fillRect(0,0,512,512);
  const s=n=>{let v=Math.sin(n)*9999;return v-Math.floor(v);};
  x.strokeStyle='#9A7A5A'; x.lineWidth=2;
  for(let i=0;i<45;i++){
    const px=s(i*3)*512,py=s(i*3+1)*512,pw=28+s(i*3+2)*55,ph=24+s(i*7)*42;
    x.strokeRect(px,py,pw,ph);
    x.fillStyle=`rgba(${90+s(i)*55|0},${70+s(i*2)*40|0},${45+s(i*4)*30|0},.28)`;
    x.fillRect(px+1,py+1,pw-2,ph-2);
  }
  const tex=new THREE.CanvasTexture(cv); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; return tex;
}
const mCourtFloor=new THREE.MeshStandardMaterial({map:mkStoneTex(),roughness:.9});
const mTerraFloor=new THREE.MeshStandardMaterial({color:C.terra,roughness:.88});

// ── scene group ───────────────────────────────────────────────────────────────
const hg=new THREE.Group(); scene.add(hg);

function place(mesh,x,y,z,ry=0){
  mesh.position.set(x,y,z); if(ry) mesh.rotation.y=ry; hg.add(mesh); return mesh;
}

function addFloor(w,d,mat,px,pz){
  place(mkBox(w,0.15,d,mat),px,-0.075,pz);
}

function addWall(w,h,d,mat,px,pz,ry=0){
  place(mkBox(w,h,d,mat),px,h/2,pz,ry);
  const hw=w/2+0.2,hd=d/2+0.2;
  const cs=Math.abs(Math.cos(ry)),sn=Math.abs(Math.sin(ry));
  addCol(px-(hw*cs+hd*sn),px+(hw*cs+hd*sn),pz-(hw*sn+hd*cs),pz+(hw*sn+hd*cs));
}

// arched opening (decorative arch above a gap)
function addArch(cx,cz,w,totalH,depth,ry=0){
  const pierH=totalH-w/2, r=w/2;
  const ag=new THREE.Group();
  // left pier fill
  const lp=mkBox(depth,pierH,depth,mWall); lp.position.set(0,pierH/2,0); ag.add(lp);
  const rp=mkBox(depth,pierH,depth,mWall); rp.position.set(w,pierH/2,0); ag.add(rp);
  // arch segments
  for(let i=0;i<=10;i++){
    const a=Math.PI/10*i;
    const sl=mkBox(Math.PI*r/10+.05,depth*.9,depth,mWall);
    sl.position.set(r-r*Math.cos(a),pierH+r*Math.sin(a),0);
    sl.rotation.z=-a+Math.PI/2; ag.add(sl);
  }
  ag.position.set(cx-w/2,0,cz); ag.rotation.y=ry; hg.add(ag);
}

function addRoof(w,d,px,py,pz,ry=0){
  const rg=new THREE.Group(); rg.position.set(px,py,pz); rg.rotation.y=ry;
  const pitch=1.8, hw=w/2, hd=d/2;
  const mR=mst(C.terra,.85), mRd=mst(C.terraDk,.88);
  const tri=(pts,m)=>{
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
    geo.computeVertexNormals();
    const mesh=new THREE.Mesh(geo,m); mesh.castShadow=true; return mesh;
  };
  rg.add(
    tri([-hw,0,-hd, hw,0,-hd, hw,pitch,0, hw,pitch,0,-hw,pitch,0,-hw,0,-hd],mR),
    tri([-hw,0,hd,  hw,pitch,0,-hw,pitch,0, hw,pitch,0,hw,0,hd,-hw,0,hd],mR),
    tri([-hw,0,-hd,-hw,pitch,0,-hw,0,hd],mRd),
    tri([hw,0,-hd,hw,0,hd,hw,pitch,0],mRd)
  );
  // tile ridges
  const tileM=mst(C.terra,.8);
  const rows=Math.floor(d*1.5);
  for(let i=0;i<rows;i++){
    const t=i/rows, tz=-hd+t*d;
    const ty=t<.5?pitch*t*2:pitch*(1-(t-.5)*2);
    const tg=new THREE.CylinderGeometry(.11,.11,w,6,1,true);
    const tm=new THREE.Mesh(tg,tileM); tm.rotation.z=Math.PI/2;
    tm.position.set(0,ty+pitch+.11,tz); rg.add(tm);
  }
  hg.add(rg);
}

function addWell(px,pz){
  const g=new THREE.Group(); g.position.set(px,0,pz);
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1.6,16,1,true),mst(C.stoneDk,.92));
  cyl.position.y=.8; cyl.castShadow=true; g.add(cyl);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.12,8,24),mStone);
  ring.position.y=1.65; ring.rotation.x=Math.PI/2; g.add(ring);
  const arch=new THREE.Mesh(new THREE.TorusGeometry(1.1,.06,8,20,Math.PI),mIron);
  arch.position.y=1.7; arch.rotation.x=Math.PI/2; g.add(arch);
  [-1,1].forEach(s=>{
    const p=mkBox(.09,2.2,.09,mIron); p.position.set(s*1.1,2.8,0); g.add(p);
  });
  const pul=new THREE.Mesh(new THREE.TorusGeometry(.18,.04,6,12),mIron);
  pul.position.set(0,3.1,0); pul.rotation.x=Math.PI/2; g.add(pul);
  hg.add(g); addCol(px-1.4,px+1.4,pz-1.4,pz+1.4);
}

function addPot(px,pz,sc=1){
  const g=new THREE.Group(); g.position.set(px,0,pz);
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(.3*sc,.2*sc,.5*sc,10),mTerra);
  pot.position.y=.25*sc; g.add(pot);
  const trunk=mkBox(.12*sc,1.3*sc,.12*sc,mWoodDk); trunk.position.y=.5*sc+.65*sc; g.add(trunk);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.55*sc,8,6),mLeaf);
  leaf.position.y=.5*sc+1.35*sc; leaf.scale.y=1.25; g.add(leaf);
  g.traverse(m=>{if(m.isMesh){m.castShadow=true;}});
  hg.add(g);
}

function addOlive(px,pz){
  const g=new THREE.Group(); g.position.set(px,0,pz);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,3,8),mWoodDk);
  trunk.position.y=1.5; trunk.castShadow=true; g.add(trunk);
  for(let i=0;i<3;i++){
    const lm=new THREE.Mesh(new THREE.SphereGeometry(1.3+i*.2,7,5),mst(0x5A8A4A,.9));
    lm.position.set(Math.sin(i*2.1)*.8,3+i*.4,Math.cos(i*2.1)*.8);
    lm.scale.y=.8; lm.castShadow=true; g.add(lm);
  }
  scene.add(g);
}

// ── BUILD HOUSE ───────────────────────────────────────────────────────────────
// ground
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mst(0xC8B070,.95));
gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

// floors
addFloor(40,10,mTerraFloor,  0,  5);   // central body
addFloor(10,20,mTerraFloor,-15,-10);   // left wing
addFloor(10,20,mTerraFloor, 15,-10);   // right wing
addFloor(20,20,mCourtFloor,  0,-10);   // courtyard

// ── exterior walls ────────────────────────────────────────────────────────────
addWall(40,WH,WT, mWall,  0, 10);      // north
addWall(10,WH,WT, mWall,-15,-20);      // south left wing
addWall(10,WH,WT, mWall, 15,-20);      // south right wing
addWall(WT,WH,30, mWall,-20,-5);       // west
addWall(WT,WH,30, mWall, 20,-5);       // east
addWall(WT,WH,20, mWall,-10,-10);      // left wing inner east
addWall(WT,WH,20, mWall, 10,-10);      // right wing inner west
// south wall of central body (split for courtyard opening + glass bays)
addWall(10,WH,WT, mWall,-15, 0);
addWall(10,WH,WT, mWall, 15, 0);

// ── glass bays (central body south facade) ────────────────────────────────────
const bayXs=[-6,0,6];
bayXs.forEach(bx=>{
  // glass
  const gp=mkBox(4.0,4.5,.06,mGlass); place(gp,bx,2.25,0);
  // mullions
  [-1.3,0,1.3].forEach(mx=>{
    place(mkBox(.07,4.5,.09,mWoodDk),bx+mx,2.25,0);
  });
  // wall above bay
  place(mkBox(4.0,WH-4.5,WT,mWall),bx,4.5+(WH-4.5)/2,0);
});
// wall segments between bays
addWall(1.5,WH,WT, mWall,-9.25,0);
addWall(1.5,WH,WT, mWall, 9.25,0);
addWall(1.6,WH,WT, mWall,-3.1, 0);
addWall(1.6,WH,WT, mWall, 3.1, 0);

// ── interior walls ────────────────────────────────────────────────────────────
// kitchen divider x=8
addWall(WT,WH,10,mWallW, 8, 5);

// left wing room dividers (3 bedrooms)
addWall(8,WH,WT,mWallW,-16,-7);
addWall(8,WH,WT,mWallW,-16,-13);
// door gaps left as open (no door mesh, just open)

// right wing dividers
addWall(8,WH,WT,mWallW,16,-8);
addWall(8,WH,WT,mWallW,16,-14);
addWall(8,WH,WT,mWallW,16,-19);

// ── arches ────────────────────────────────────────────────────────────────────
// courtyard arches on central body south (above bays)
bayXs.forEach(bx=>addArch(bx,0.25,4.2,5.5,.4));
// left wing arches facing courtyard
[-4,-10,-16].forEach(az=>addArch(-10,az,2.4,4,.4,-Math.PI/2));
// right wing arches facing courtyard
[-4,-10,-16].forEach(az=>addArch(10,az,2.4,4,.4,Math.PI/2));

// ── roofs ─────────────────────────────────────────────────────────────────────
addRoof(40,10,  0,WH, 5);
addRoof(10,20,-15,WH,-10);
addRoof(10,20, 15,WH,-10);

// ── ceilings + beams ──────────────────────────────────────────────────────────
place(mkBox(40,.14,10,mst(0xEEE8D8,.9)),0,WH,5);
for(let bx=-18;bx<=18;bx+=4) place(mkBox(.28,.24,10,mWoodDk),bx,WH-.12,5);
place(mkBox(10,.14,20,mst(0xEEE8D8,.9)),-15,WH,-10);
place(mkBox(10,.14,20,mst(0xEEE8D8,.9)), 15,WH,-10);

// ── courtyard ────────────────────────────────────────────────────────────────
addWell(0,-10);
[[-7,-7],[-7,-13],[7,-7],[7,-13],[-4,-5],[4,-5],[-4,-15],[4,-15],[-1,-10.5],[1,-10.5]]
  .forEach(([px,pz])=>addPot(px,pz,.8+Math.random()*.35));

// ── main gate ─────────────────────────────────────────────────────────────────
(()=>{
  const g=new THREE.Group(); g.position.set(0,0,-20);
  [-2.3,2.3].forEach(sx=>{
    const p=mkBox(.6,5.5,.6,mStone); p.position.set(sx,2.75,0); g.add(p);
    const cap=mkBox(.85,.3,.85,mStone); cap.position.set(sx,5.65,0); g.add(cap);
  });
  [-1,1].forEach(side=>{
    const pw=1.85, ox=side*(pw/2+.1);
    const frame=new THREE.Group(); frame.position.set(ox,0,0);
    [[0,pw,.1,4.3],[0,pw,.1,.1],[-pw/2+.05,.1,4.3,2.15],[pw/2-.05,.1,4.3,2.15]].forEach(([bx,bw,bh,by])=>{
      const b=mkBox(bw,bh,.09,mIron); b.position.set(bx,by,0); frame.add(b);
    });
    for(let i=1;i<7;i++){
      const bar=mkBox(.07,4.1,.07,mIron); bar.position.set(-pw/2+i*pw/7,2.15,0); frame.add(bar);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(.08,.28,4),mIron);
      tip.position.set(-pw/2+i*pw/7,4.55,0); frame.add(tip);
    }
    g.add(frame);
  });
  // arch
  for(let i=0;i<=16;i++){
    const a=Math.PI/16*i;
    const b=mkBox(.11,.11,.5,mIron);
    b.position.set(-Math.cos(a)*2.5,4.5+Math.sin(a)*2.5,0); b.rotation.z=a; g.add(b);
  }
  g.traverse(m=>{if(m.isMesh){m.castShadow=true;}});
  scene.add(g);
  addCol(-2.7,2.7,-20.5,-19.5);
})();

// entry path
const path=mkBox(4,.12,8,mStone); path.position.set(0,.06,-24.5); scene.add(path);

// ── kitchen furniture ─────────────────────────────────────────────────────────
place(mkBox(10,.9,.8,mst(C.stoneDk,.6)),14,.45,9.6);
place(mkBox(10,.05,.8,mStone),14,.93,9.6);
const azBack=mkBox(10,1.2,.05,mAzul); place(azBack,14,1.5,9.75);
place(mkBox(3,.9,1.5,mWoodDk),14,.45,6.5);

// ── salon furniture ───────────────────────────────────────────────────────────
// fireplace
place(mkBox(2.5,3.5,.5,mStone),-18,1.75,5);
place(mkBox(1.8,1.5,.56,mst(C.black,1)),-18,.9,5);
place(mkBox(2.8,.2,.7,mStone),-18,3.6,5);
place(mkBox(2.6,.75,.1,mAzul),-18,3.15,4.78);
// sofa
place(mkBox(6,.8,1.5,mst(0xA09070,.9)),-10,.4,3.5);
place(mkBox(1.5,.8,4,mst(0xA09070,.9)),-13.25,.4,5.5);
[[-8.5,3.5],[-10.5,3.5],[-12.5,3.5]].forEach(([x,z])=>place(mkBox(1.1,.22,1.1,mst(0xC09060,.8)),x,.84,z));
// coffee table
place(mkBox(2.4,.42,1.4,mWoodDk),-10.5,.21,5.5);
// dining table + chairs
place(mkBox(4,.75,2,mWood),-4,.375,7.5);
[[-5.5,6.4],[-4,6.4],[-2.5,6.4],[-5.5,8.6],[-4,8.6],[-2.5,8.6]].forEach(([x,z])=>{
  place(mkBox(.85,.82,.85,mst(C.woodL,.75)),x,.41,z);
  const bk=mkBox(.85,.55,.08,mst(C.woodL,.75)); place(bk,x,.88,z+(z<7?-.45:.45));
});

// ── bedrooms ──────────────────────────────────────────────────────────────────
[[-16,-2],[-16,-9.5],[-16,-16]].forEach(([x,z])=>{
  place(mkBox(3.5,.6,5,mst(0xDDCCBB,.8)),x,.3,z);
  place(mkBox(1.4,.2,.8,mst(0xFFFFEE,.7)),x,.72,z-1.8);
});
// master bed
place(mkBox(4.5,.7,5.5,mst(0xEEDDCC,.8)),15.5,.35,-17.5);
[-1,1].forEach(s=>place(mkBox(1.6,.22,.8,mst(0xFFFFEE,.7)),14.5+s*1.1,.82,-15.5));
// desk
place(mkBox(4,.75,1.8,mWoodDk),18,.375,-4);

// ── exterior olives ───────────────────────────────────────────────────────────
[[-28,-10],[-28,0],[-25,10],[28,-10],[28,0],[25,10],[-10,20],[10,20],[0,22],[-15,-26],[15,-26]]
  .forEach(([x,z])=>addOlive(x,z));

// ── interior point lights ─────────────────────────────────────────────────────
[[0,5,1.2],[-10,5,.8],[10,5,.8],[-15,-5,.9],[-15,-12,.9],[15,-5,.9],[15,-15,.9],[0,-10,.6]]
  .forEach(([x,z,i])=>{const l=new THREE.PointLight(0xFFD088,i,15);l.position.set(x,WH-.5,z);scene.add(l);});
[[-19,8],[19,8],[-9,-1],[9,-1]]
  .forEach(([x,z])=>{const l=new THREE.PointLight(0xFFAA44,.8,10);l.position.set(x,3.5,z);scene.add(l);});

// ══ CONTROLS ═════════════════════════════════════════════════════════════════
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let started=false, isLocked=false;
const keys={};
const euler=new THREE.Euler(0,0,0,'YXZ');
const dir=new THREE.Vector3();

// keyboard
document.addEventListener('keydown',e=>keys[e.code]=true);
document.addEventListener('keyup',  e=>keys[e.code]=false);

// pointer lock (desktop)
canvas.addEventListener('click',()=>{if(started&&!isTouch&&!isLocked)canvas.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>isLocked=document.pointerLockElement===canvas);
document.addEventListener('mousemove',e=>{
  if(!isLocked)return;
  euler.setFromQuaternion(cam.quaternion);
  euler.y-=e.movementX*.002; euler.x-=e.movementY*.002;
  euler.x=Math.max(-1.1,Math.min(1.1,euler.x));
  cam.quaternion.setFromEuler(euler);
});

// start button – works on touch AND click
const overlay=document.getElementById('overlay');
function doStart(){
  overlay.style.display='none';
  started=true;
  if(isTouch){
    document.getElementById('joy').style.display='block';
    document.getElementById('look').style.display='block';
    document.getElementById('mmc').parentElement.style.display='none'; // hide minimap on small screen
  } else {
    canvas.requestPointerLock();
  }
}
const btn=document.getElementById('startBtn');
btn.addEventListener('touchend',e=>{e.preventDefault();doStart();},{passive:false});
btn.addEventListener('click',doStart);

// ── virtual joystick ──────────────────────────────────────────────────────────
const joyEl=document.getElementById('joy');
const jknob=document.getElementById('jknob');
let joyId=-1,joyActive=false,jDX=0,jDY=0;
const JR=45;

joyEl.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0]; joyId=t.identifier; joyActive=true;
  const r=joyEl.getBoundingClientRect();
  joyEl._ox=r.left+r.width/2; joyEl._oy=r.top+r.height/2;
},{passive:false});
joyEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==joyId)continue;
    jDX=t.clientX-joyEl._ox; jDY=t.clientY-joyEl._oy;
    const l=Math.hypot(jDX,jDY); if(l>JR){jDX*=JR/l;jDY*=JR/l;}
    jknob.style.transform=`translate(calc(-50% + ${jDX}px),calc(-50% + ${jDY}px))`;
  }
},{passive:false});
const jEnd=e=>{for(const t of e.changedTouches){if(t.identifier===joyId){joyActive=false;joyId=-1;jDX=0;jDY=0;jknob.style.transform='translate(-50%,-50%)';}}};
joyEl.addEventListener('touchend',jEnd);
joyEl.addEventListener('touchcancel',jEnd);

// ── look zone ─────────────────────────────────────────────────────────────────
const lookEl=document.getElementById('look');
let lookId=-1,lx=0,ly=0;
lookEl.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0]; lookId=t.identifier; lx=t.clientX; ly=t.clientY;
},{passive:false});
lookEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==lookId)continue;
    const dx=t.clientX-lx, dy=t.clientY-ly; lx=t.clientX; ly=t.clientY;
    euler.setFromQuaternion(cam.quaternion);
    euler.y-=dx*.004; euler.x-=dy*.004;
    euler.x=Math.max(-1.1,Math.min(1.1,euler.x));
    cam.quaternion.setFromEuler(euler);
  }
},{passive:false});
const lEnd=e=>{for(const t of e.changedTouches){if(t.identifier===lookId)lookId=-1;}};
lookEl.addEventListener('touchend',lEnd);
lookEl.addEventListener('touchcancel',lEnd);

// ══ ROOM LABELS ══════════════════════════════════════════════════════════════
const ROOMS=[
  {n:'Grand Salon',      x0:-20,x1:-8, z0:0, z1:10},
  {n:'Salle à Manger',   x0:-8, x1:8,  z0:4, z1:10},
  {n:'Cuisine',          x0:8,  x1:20, z0:0, z1:10},
  {n:'Cour Intérieure',  x0:-10,x1:10, z0:-20,z1:0},
  {n:'Chambre 1',        x0:-20,x1:-10,z0:0, z1:-7},
  {n:'Chambre 2',        x0:-20,x1:-10,z0:-7,z1:-13},
  {n:'Chambre 3',        x0:-20,x1:-10,z0:-13,z1:-20},
  {n:'Bureau',           x0:10, x1:20, z0:0, z1:-8},
  {n:'Chambre Parentale',x0:10, x1:20, z0:-8,z1:-14},
  {n:'Dressing / SDB',   x0:10, x1:20, z0:-14,z1:-20},
];
const rlabel=document.getElementById('rlabel');
let lastRoom='';
function updateRoom(){
  const p=cam.position;
  const r=ROOMS.find(r=>p.x>=r.x0&&p.x<=r.x1&&p.z<=r.z0&&p.z>=r.z1)||{n:'Extérieur'};
  if(r.n!==lastRoom){
    lastRoom=r.n; rlabel.textContent=r.n; rlabel.style.opacity='1';
    clearTimeout(rlabel._t); rlabel._t=setTimeout(()=>rlabel.style.opacity='0',3200);
  }
}

// ══ MINIMAP ═══════════════════════════════════════════════════════════════════
const mmc=document.getElementById('mmc');
const mmx=mmc.getContext('2d');
function drawMM(){
  const W=120; mmx.clearRect(0,0,W,W);
  const sc=W/50, ox=W/2, oz=W/2;
  const toM=(x,z)=>[ox+x*sc/2, oz-z*sc/2];
  mmx.fillStyle='#C8B49066'; mmx.fillRect(...toM(-20,10),40*sc/2,10*sc/2);
  mmx.fillRect(...toM(-20,0),10*sc/2,20*sc/2);
  mmx.fillRect(...toM(10,0),10*sc/2,20*sc/2);
  mmx.fillStyle='#D4C4A866'; mmx.fillRect(...toM(-10,0),20*sc/2,20*sc/2);
  const [px,pz]=toM(cam.position.x,cam.position.z);
  mmx.fillStyle='#E8973A'; mmx.beginPath(); mmx.arc(px,pz,3.5,0,Math.PI*2); mmx.fill();
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  mmx.strokeStyle='#E8973A'; mmx.lineWidth=1.5;
  mmx.beginPath(); mmx.moveTo(px,pz); mmx.lineTo(px+fwd.x*9,pz-fwd.z*9); mmx.stroke();
}

// ══ COLLISION ════════════════════════════════════════════════════════════════
const PR=0.5;
function blocked(nx,nz){
  return colliders.some(c=>nx>c.x0-PR&&nx<c.x1+PR&&nz>c.z0-PR&&nz<c.z1+PR);
}

// ══ LOOP ═════════════════════════════════════════════════════════════════════
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(started){
    dir.set(0,0,0);
    if(keys.KeyW||keys.KeyZ||keys.ArrowUp)    dir.z-=1;
    if(keys.KeyS||keys.ArrowDown)              dir.z+=1;
    if(keys.KeyA||keys.KeyQ||keys.ArrowLeft)  dir.x-=1;
    if(keys.KeyD||keys.ArrowRight)             dir.x+=1;
    if(joyActive){dir.x+=jDX/JR; dir.z+=jDY/JR;}
    if(dir.length()>0){
      dir.normalize();
      const yq=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,euler.y,0));
      dir.applyQuaternion(yq);
      const spd=(keys.ShiftLeft||keys.ShiftRight)?10:5;
      const nx=cam.position.x+dir.x*spd*dt;
      const nz=cam.position.z+dir.z*spd*dt;
      if(!blocked(nx,cam.position.z))cam.position.x=nx;
      if(!blocked(cam.position.x,nz))cam.position.z=nz;
    }
    cam.position.y=2.2;
    updateRoom();
    drawMM();
  }
  renderer.render(scene,cam);
}
loop();
</script>
